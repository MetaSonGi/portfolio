<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>손효기 Hyogi Son — LEGO 월드 포트폴리오</title>
<meta name="description" content="손효기(Hyogi Son) — 레고 게임 월드 포트폴리오. 마을을 돌아다니며 기술, 경력, 프로젝트를 만나보세요.">
<link rel="stylesheet" href="styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

<nav class="game-nav">
  <div class="nav-logo">&lt;Hyogi Son /&gt; <span class="nav-sub">🧱 LEGO World</span></div>
  <div class="nav-zones">
    <button data-zone="tech">🧱 기술</button>
    <button data-zone="about">😊 소개</button>
    <button data-zone="career">📜 경력</button>
    <button data-zone="projects">🚀 프로젝트</button>
    <button data-zone="contact">✉️ 연락</button>
  </div>
</nav>

<div id="game-wrap">
  <canvas id="game"></canvas>
  <div id="labels"></div>
  <div class="hint" id="hint">
    <span>🖱️ 클릭으로 이동</span><span>⌨️ WASD / 방향키</span><span>🏠 구역에 들어가면 설명 표시</span>
    <button id="hint-close" aria-label="힌트 닫기">✕</button>
  </div>
  <div id="loading"><div class="load-box">🧱<p>레고 월드를 조립하는 중…</p></div></div>
</div>

<aside id="panel" aria-hidden="true">
  <button id="panel-close" aria-label="패널 닫기">✕</button>
  <div id="panel-body"></div>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="game.js"></script>
</body>
</html>
